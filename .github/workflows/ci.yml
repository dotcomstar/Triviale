name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # jsdom (a test devDependency) requires Node ^22.22.2 || ^24.15.0 || >=26.0.0
      # (its bundled undici uses an internal webidl API not present on older
      # Node) - keep this in sync with whatever's actually in package.json.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # package.json's `allowScripts` field (npm's postinstall-script gating,
      # needed to let esbuild's postinstall run) requires npm 11+, which the
      # default Node 24 runner doesn't bundle yet.
      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Regenerates .github/badges/coverage.json (read by the README's
      # shields.io endpoint badge) and commits it back to main. Only runs
      # on a direct push to main (not PRs, not production) so forked-PR
      # runs never need push access, and `[skip ci]` in the commit message
      # stops this push from re-triggering the workflow.
      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          npm run test:coverage
          node -e "
            const pct = require('./coverage/coverage-summary.json').total.statements.pct;
            const color = pct >= 80 ? 'green' : pct >= 60 ? 'yellow' : 'red';
            const badge = { schemaVersion: 1, label: 'coverage', message: pct.toFixed(0) + '%', color };
            require('fs').writeFileSync('.github/badges/coverage.json', JSON.stringify(badge));
          "
          if ! git diff --quiet -- .github/badges/coverage.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/badges/coverage.json
            git commit -m "Update coverage badge [skip ci]"
            git push
          fi
